#
# RISC-V Debug transport over JTAG (JTAG registers "dmi", "dtmcs")
#
dmi_databits: 32
dtmcs_abits: 7
dtmcs_idle: 7
#
# Basic info
#
core_xlen: 32
supported_modes:
- M
supported_extensions:
- I
- M
initial_pc_value: 0x1000
wfi_is_nop: false
#
# Capabilities of "dmcontrol" & "dmstatus" debug module registers
#
resethaltreq_implemented: false
dmstatus_confsptrvalid: false
dmstatus_impebreak: false
dm_always_authenticated: true
dmcontrol_hasel_implemented: false
unavailable_state_implemented: false
harts_get_resumed_when_dm_is_reset: true
#
# "hartinfo" debug module register
#
hartinfo_implemented: false
hartinfo_expected_dataaccess: 0
hartinfo_expected_dataaddr: 0
hartinfo_expected_datasize: 0
hartinfo_expected_nscratch: 0
#
# "dcsr" register (Debug CSR)
#
dcsr_valid_ebreakm: !!set {0, 1}
dcsr_valid_ebreaks: !!set {0, 1}
dcsr_valid_ebreaku: !!set {0, 1}
dcsr_valid_mprven: !!set {0}
dcsr_valid_stepie: !!set {0}
dcsr_valid_stopcount: !!set {0, 1}
dcsr_valid_stoptime: !!set {0}
#
# Program Buffer
#
progbufsize: 4
progbuf_execution_clobbers_dpc: false
progbuf_mapped_to_memory: true
progbuf_base_address: 0xff0
progbuf_jumps_out_of_buffer_allowed: false
progbuf_jumps_within_buffer_allowed: false
progbuf_auipc_instruction_is_legal: false
progbuf_is_writable: false
#
# Abstract Memory Access
#
abstract_memory_supported: false
#
# Abstract Quick Access
#
abstract_quick_access_supported: false
#
# Abstract Register Access
#
abstract_aarpostincrement_supported: false
abstractauto_implemented_mask: 1
abstractcs_datacount: 1
cmderr_inaccessible_reg: 3
cmderr_nonexistent_reg: 3
cmderr_too_small_write: 2
support_abstract_read_when_running: false
support_abstract_write_when_running: false
#
